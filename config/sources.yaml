# Source register: what download.py fetches, and the hand-written facts about each source.
# Verified against the live publishers on 2026-10-01 (Phase 2). docs/data_sources.md is rendered
# from this file plus data/manifest.json (`lsc-pop docs`).
#
# Census acquisition: RM032 and RM200 have no LSOA bulk download, so they come from the Nomis API
# (paged CSV). The S3 seed comes from the ONS custom-dataset API. See ADR-0010 and ADR-0011.

sources:
  - id: S1
    title: "Census 2021 RM032 - Ethnic group by sex by age (LSOA 2021)"
    role: "Ethnicity margin (IPF row margins)"
    publisher: "ONS (via Nomis, dataset NM_2132_1)"
    landing_page: "https://www.nomisweb.co.uk/datasets/c2021rm032"
    release_date: "2023-03-28"
    edition: "Census 2021, RM032 version 1"
    reference_date: "2021-03-21"
    geography: "LSOA 2021, England (E01*), 33,755 areas"
    status: census
    files:
      - name: rm032_lsoa21_england.csv
        kind: nomis_paged
        url: "https://www.nomisweb.co.uk/api/v01/dataset/NM_2132_1.data.csv?geography=2092957699TYPE151&c2021_eth_20=0...19&c2021_age_6=1...5&c_sex=1,2&measures=20100&select=geography_code,c2021_eth_20,c2021_age_6,c_sex,obs_value,record_count"
        description: "Long CSV: geography_code, c2021_eth_20 (0=total, 1-19), c2021_age_6 (1-5), c_sex (1=F, 2=M), obs_value. Pages joined; Nomis RECORD_COUNT column retained."
        expected_rows: 6751000   # 33,755 x 20 x 5 x 2
    quirks:
      - "Ethnic group codes 1-19 follow ethnic_group_tb_20b order (1 Bangladeshi ... 13 White British ... 19 Any other); verified identical to config/mappings/ethnicity_19_to_6.csv."
      - "Nomis omits the 'Does not apply' (-8) category. We fetch the all-groups total (code 0) instead and check that it equals the sum of codes 1-19 per LSOA x sex x band. This is the same check as 'Does not apply' = 0 (brief §10)."
      - "Age bands (c2021_age_6 / ONS resident_age_5c): 1 = 24 and under, 2 = 25-34, 3 = 35-49, 4 = 50-64, 5 = 65 and over."
      - "Cell key perturbation and targeted record swapping: LSOA x sex totals do not exactly match RM200 or TS021 (reconciled in Stage B)."
      - "The ONS API at area-type=lsoa returns identical values (spot-checked on E01011954). It is an equivalent fallback."
      - "Nomis returns rows in its own geography order, not code order. Downstream stages sort."

  - id: S2
    title: "Census 2021 RM200 - Sex by single year of age (LSOA 2021)"
    role: "Single-year age margin (IPF column margins)"
    publisher: "ONS (via Nomis, dataset NM_2300_1)"
    landing_page: "https://www.nomisweb.co.uk/datasets/c2021rm200"
    release_date: "2023-03-28"
    edition: "Census 2021, RM200 version 1"
    reference_date: "2021-03-21"
    geography: "LSOA 2021, England (E01*), 33,755 areas"
    status: census
    files:
      - name: rm200_lsoa21_england.csv
        kind: nomis_paged
        url: "https://www.nomisweb.co.uk/api/v01/dataset/NM_2300_1.data.csv?geography=2092957699TYPE151&c2021_age_92=0...91&c_sex=1,2&measures=20100&select=geography_code,c2021_age_92,c_sex,obs_value,record_count"
        description: "Long CSV: geography_code, c2021_age_92 (0=total; 1-91 = age 0..90+, i.e. age = code - 1), c_sex, obs_value."
        expected_rows: 6210920   # 33,755 x 92 x 2
    quirks:
      - "TS009 has no LSOA level (LA and above only), so RM200 is the LSOA single-year source."
      - "Nomis age code = age + 1 (1 = under 1, 91 = 90 and over). Code 0 = all ages."
      - "Independently perturbed from RM032 (see S1)."

  - id: S3
    title: "Census 2021 ethnic group (20) x sex x single year of age, LTLA 2021 (custom dataset)"
    role: "Ethnicity-specific age-shape seed for IPF; LA-level validation"
    publisher: "ONS (Create a custom dataset API, population type UR)"
    landing_page: "https://www.ons.gov.uk/datasets/create"
    release_date: "2023-03-28"
    edition: "Census 2021 custom dataset API (api.beta.ons.gov.uk/v1), queried 2026-10"
    reference_date: "2021-03-21"
    geography: "LTLA 2021, England (E06/E07/E08/E09)"
    status: census
    files:
      - name: ltla21_eth20_sex_age91.jsonl.gz
        kind: ons_api_batched
        url: "https://api.beta.ons.gov.uk/v1/population-types/UR/census-observations?dimensions=ethnic_group_tb_20b,sex,resident_age_91a"
        area_type: ltla
        area_prefix: "E"
        batch_size: 27          # 27 x 20 x 2 x 91 = 98,280 rows < 100,000 API cap
        description: "Primary seed: single year 0-90+. Disclosure control blocks a few small LTLAs (recorded per batch)."
      - name: ltla21_eth20_sex_age23.jsonl.gz
        kind: ons_api_batched
        url: "https://api.beta.ons.gov.uk/v1/population-types/UR/census-observations?dimensions=ethnic_group_tb_20b,sex,resident_age_23a"
        area_type: ltla
        area_prefix: "E"
        batch_size: 108         # 108 x 20 x 2 x 23 = 99,360 rows
        description: "Fallback seed (23 age categories) for LTLAs blocked at single year of age."
    quirks:
      - "The API blocks whole areas, not cells, when a query is too detailed for an area. At 91a, 8 English LTLAs are blocked (E06000053 Isles of Scilly, E07000026, E07000029, E07000030, E07000046, E07000047, E07000166, E07000167). At 23a only Isles of Scilly is blocked. ADR-0011 sets the fallbacks."
      - "MSOA is unusable at finer ages: 41% of MSOAs are blocked at 23a and 8.6% at 8b. LSOA x 91a is refused as 'too large'."
      - "API caps a response at 100,000 rows (HTTP 403 beyond). Cloudflare blocks default library User-Agents and rate-limits (HTTP 429, backoff applied)."
      - "Perturbed independently of RM032/RM200. Summed to RM032 bands at LTLA, 36% of cells match exactly, with mean abs diff 1.3 and max 12."
      - "The API includes 'Does not apply' (-8), always 0 for usual residents."

  - id: S4
    title: "Census 2021 TS021 - Ethnic group (LSOA 2021)"
    role: "Validation of 2021 ethnic totals"
    publisher: "ONS (via Nomis bulk download)"
    landing_page: "https://www.nomisweb.co.uk/sources/census_2021_bulk"
    release_date: "2022-11-29"
    edition: "Nomis bulk zip census2021-ts021 (ONS TS021 is at version 3, 2023-03-28)"
    reference_date: "2021-03-21"
    geography: "OA/LSOA/MSOA/LTLA/UTLA/region/country 2021, England and Wales"
    status: census
    files:
      - name: census2021-ts021.zip
        url: "https://www.nomisweb.co.uk/output/census/2021/census2021-ts021.zip"
        description: "Zip of wide CSVs; census2021-ts021-lsoa.csv has 35,672 rows (E+W), total + 5 high-level + 19 detailed groups."
    quirks:
      - "Wide format with 5 high-level groups interleaved among the 19 detailed groups. Select by label, not position."
      - "England and Wales; filter E01*. England LSOA total 56,490,108."
      - "The bulk zip predates the ONS v3 re-release (2023-03-28). Check in Stage B whether the counts differ."

  - id: S5
    title: "ONS LSOA population estimates by single year of age and sex, mid-2022 (revised) to mid-2024"
    role: "Current-year totals (roll-forward target)"
    publisher: "ONS"
    landing_page: "https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/lowersuperoutputareamidyearpopulationestimates"
    release_date: "2025-11-07"
    edition: "Mid-2022 revised (Nov 2025) to mid-2024 (SAPE2024)"
    reference_date: "2024-06-30"
    geography: "LSOA 2021, England and Wales (33,755 England)"
    status: supporting information
    files:
      - name: sapelsoasyoa20222024.xlsx
        url: "https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/lowersuperoutputareamidyearpopulationestimates/mid2022revisednov2025tomid2024/sapelsoasyoa20222024.xlsx"
        description: "Sheets 'Mid-2022 LSOA 2021', 'Mid-2023 LSOA 2021', 'Mid-2024 LSOA 2021'; header on row 4; LAD 2023 code/name, LSOA code/name, Total, F0..F90, M0..M90."
    quirks:
      - "Single-year-of-age LSOA estimates are 'supporting information', not accredited official statistics (Note 4). ONS doesn't recommend using them directly."
      - "F90/M90 is the open-ended 90+ group (no '+' in the header)."
      - "LAD columns are LAD 2023 codes. Barnsley (E08000016) and Sheffield (E08000019) differ from the LAD 2026 codes in S7 (E08000038/E08000039). Use S7 for LAD."
      - "Mid-2024 England total 58,620,101 across 33,755 LSOAs. Total = sum of the 182 cells exactly. Integers."
      - "Mid-2025 LSOA estimates are NOT yet published. The ONS release calendar lists them as provisional for Dec 2026 to Jan 2027 (checked 2026-10-01)."

